# Dependabot configuration
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# PRs open against `dev`, which is the default branch and the integration
# target for both the CI and Validation workflows.
version: 2
updates:
  # .NET / NuGet: a single "/" entry recursively discovers every PackageReference
  # project under src/ and test/ as well as the installer's packages.config.
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    target-branch: dev
    open-pull-requests-limit: 10
    # Supply-chain hardening: hold every new release for at least 7 days before
    # opening a version-update PR, so freshly published (potentially compromised)
    # package versions are not adopted immediately. Security updates are exempt
    # from cooldown and still ship right away.
    cooldown:
      default-days: 7
    # The Microsoft.Web.Administration.Refs project pins a set of 2016-era .NET
    # facade packages on purpose: they are the exact assemblies Microsoft.Web.Administration
    # 11.1.0 requests at runtime, shipped into plugins/ms.web.admin.refs so the IIS
    # management plugins load on .NET 10. Bumping them breaks the build (newer releases
    # drop the net46/DNXCore50 lib layout the publish step copies) and the runtime
    # (the service fails to load the facade at startup), so hold them at their pinned
    # versions. See PR #23 for the validation that proved removal/upgrade is unworkable.
    ignore:
      - dependency-name: "Microsoft.Win32.Primitives"
      - dependency-name: "Microsoft.Win32.Registry"
      - dependency-name: "System.Collections"
      - dependency-name: "System.Diagnostics.Debug"
      - dependency-name: "System.Diagnostics.Tools"
      - dependency-name: "System.Diagnostics.TraceSource"
      - dependency-name: "System.Globalization"
      - dependency-name: "System.Net.Primitives"
      - dependency-name: "System.Reflection"
      - dependency-name: "System.Reflection.TypeExtensions"
      - dependency-name: "System.Resources.ResourceManager"
      - dependency-name: "System.Runtime"
      - dependency-name: "System.Runtime.Extensions"
      - dependency-name: "System.Runtime.Handles"
      - dependency-name: "System.Runtime.InteropServices"
      - dependency-name: "System.Security.Principal.Windows"
      - dependency-name: "System.ServiceProcess.ServiceController"
      - dependency-name: "System.Threading"
    labels:
      - dependencies
      - .NET
    commit-message:
      prefix: build
      include: scope
    groups:
      # Collapse the routine, low-risk bumps across all the projects into one PR
      # each so 39 projects don't each spawn their own.
      nuget-minor-and-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions used by the CI and Validation workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    target-branch: dev
    open-pull-requests-limit: 5
    # Same 7-day supply-chain cooldown applied to action version bumps.
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
