name: CI

# Adapted from .azure/pipelines/build.yml. The MicroBuild signing, symbol publishing, and
# signed-bits verification stages are Microsoft-internal and are intentionally not ported;
# this workflow produces unsigned builds.
on:
  push:
    branches: [dev, 'releases/**']
  pull_request:
    branches: [dev]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  # microsoft/setup-msbuild has no Node 24 major yet; opt in ahead of the June 16, 2026
  # forced migration of Node 20 actions
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# checks: write lets dorny/test-reporter publish the test results as a check run.
permissions:
  contents: read
  checks: write

jobs:
  build-windows:
    name: Build, test, and package (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # node/npm is required by the RestoreWebResources MSBuild target, which
      # restores the self-hosted client-side libraries (jquery) during build.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: microsoft/setup-msbuild@v3

      - name: Restore solution
        run: nuget restore Microsoft.IIS.Administration.sln

      - name: Build and publish
        run: msbuild Microsoft.IIS.Administration.sln -m /t:publish /p:Configuration=Release

      - name: Run unit tests
        run: >
          dotnet test test\Microsoft.IIS.Administration.UnitTests\Microsoft.IIS.Administration.UnitTests.csproj
          --configuration Release
          --collect:"XPlat Code Coverage" --settings build/coverlet.runsettings
          --logger trx --results-directory TestResults
        # The integration suite (test\Microsoft.IIS.Administration.Tests) requires a configured IIS
        # plus a running instance of the service and is not executed on hosted runners.

      - name: Coverage report
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: TestResults/**/coverage.cobertura.xml
          targetdir: coveragereport
          reporttypes: MarkdownSummaryGithub;Cobertura

      - name: Write coverage to job summary
        if: always()
        shell: bash
        run: cat coveragereport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Unit tests (Windows)
          path: TestResults/**/*.trx
          reporter: dotnet-trx
          # The dotnet test step above already gates the job on test failure;
          # this step only surfaces the results, it should not be a second gate.
          fail-on-error: false

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit-windows
          path: |
            TestResults/**/coverage.cobertura.xml
            coveragereport/

      - name: Clean build directory
        run: powershell -NonInteractive -ExecutionPolicy Unrestricted -File scripts/build/Clean-BuildDir.ps1 -manifestDir ${{ github.workspace }}/dist

      - name: Restore installer packages
        run: nuget restore installer/IISAdministrationSetup/packages.config -SolutionDirectory installer

      - name: Build installer
        run: msbuild installer/IISAdministrationSetup.sln -m /p:Configuration=Release /p:Platform=x64

      - name: 'Publish artifact: IIS Administration'
        uses: actions/upload-artifact@v7
        with:
          name: IIS.Administration
          path: dist/

      - name: 'Publish artifact: IISAdministrationSetup'
        uses: actions/upload-artifact@v7
        with:
          name: IISAdministrationSetup
          path: installer/IISAdministrationBundle/bin/x64/Release/

      - name: 'Publish artifact: IISAdministrationSetup MSI'
        uses: actions/upload-artifact@v7
        with:
          name: IISAdministrationSetup-MSI
          path: installer/IISAdministrationSetup/bin/

  build-linux:
    name: Cross-platform build and unit tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # node/npm is required by the RestoreWebResources MSBuild target, which
      # restores the self-hosted client-side libraries (jquery) during build.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: dotnet build Microsoft.IIS.Administration.CrossPlatform.slnf --configuration Release

      - name: Run unit tests
        run: >
          dotnet test test/Microsoft.IIS.Administration.UnitTests/Microsoft.IIS.Administration.UnitTests.csproj
          --configuration Release --no-build
          --collect:"XPlat Code Coverage" --settings build/coverlet.runsettings
          --logger trx --results-directory TestResults

      - name: Coverage report
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: TestResults/**/coverage.cobertura.xml
          targetdir: coveragereport
          reporttypes: MarkdownSummaryGithub;Cobertura

      - name: Write coverage to job summary
        if: always()
        shell: bash
        run: cat coveragereport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Unit tests (Linux)
          path: TestResults/**/*.trx
          reporter: dotnet-trx
          # The dotnet test step above already gates the job on test failure;
          # this step only surfaces the results, it should not be a second gate.
          fail-on-error: false

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit-linux
          path: |
            TestResults/**/coverage.cobertura.xml
            coveragereport/
